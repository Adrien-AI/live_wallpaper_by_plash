<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            display: block;
        }
    </style>
</head>

<body>

<video
    id="wallpaper"
    autoplay
    muted
    loop
    playsinline
    webkit-playsinline
    preload="auto"
>
    <source
        src="https://raw.githubusercontent.com/Adrien-AI/live_wallpaper_by_plash/fix-autoplay-and-add-offline/My_load_Wallpaper.mp4"
        type="video/mp4">
</video>

<script>
    const video = document.getElementById("wallpaper");

    video.muted = true;
    video.volume = 0;

    async function startVideo() {
        try {
            await video.play();
            console.log("Wallpaper started automatically.");
        } catch (error) {
            console.error("Autoplay failed:", error);
        }
    }

    video.addEventListener("loadeddata", startVideo);
    video.addEventListener("canplay", startVideo);

    startVideo();
</script>

</body>
</html>
