<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        #wallpaperVideo {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            display: block;
        }
    </style>
</head>

<body>

<video
    id="wallpaperVideo"
    src="My_load_Wallpaper.mp4"
    autoplay
    muted
    loop
    playsinline
    webkit-playsinline
    preload="auto">
</video>


<script>

const video = document.getElementById("wallpaperVideo");


// =====================================================
// 1. BASIC VIDEO SETTINGS
// =====================================================

video.muted = true;
video.defaultMuted = true;
video.volume = 0;


// =====================================================
// 2. PLAY FUNCTION
// =====================================================

function startWallpaper() {

    video.muted = true;
    video.volume = 0;

    const promise = video.play();

    if (promise !== undefined) {

        promise
            .then(() => {
                console.log("Wallpaper playing");
            })
            .catch(() => {
                console.log("Playback temporarily blocked");
            });
    }
}


// =====================================================
// 3. INITIAL START
// =====================================================

window.addEventListener("load", () => {

    setTimeout(startWallpaper, 100);

});


// =====================================================
// 4. MAC WAKE / SLEEP DETECTION
// =====================================================

let lastTime = Date.now();

setInterval(() => {

    const now = Date.now();
    const difference = now - lastTime;

    /*
       If the timer suddenly jumps by more than 2 seconds,
       macOS probably suspended the WebView because the Mac
       went to sleep.
    */

    if (difference > 2000) {

        console.log("Mac wake detected");

        video.pause();

        // Give WebKit a moment to restore the page
        setTimeout(() => {

            video.muted = true;
            video.play().catch(() => {});

        }, 300);

    }

    lastTime = now;

}, 1000);


// =====================================================
// 5. PAGE VISIBILITY
// =====================================================

document.addEventListener("visibilitychange", () => {

    if (!document.hidden) {

        console.log("Wallpaper became visible");

        setTimeout(startWallpaper, 200);

    }

});


// =====================================================
// 6. PAGE FOCUS
// =====================================================

window.addEventListener("focus", () => {

    setTimeout(startWallpaper, 200);

});


// =====================================================
// 7. PAGE SHOW
// =====================================================

window.addEventListener("pageshow", () => {

    setTimeout(startWallpaper, 200);

});


// =====================================================
// 8. VIDEO EVENTS
// =====================================================

video.addEventListener("loadeddata", () => {

    startWallpaper();

});

video.addEventListener("canplay", () => {

    startWallpaper();

});


// =====================================================
// 9. IF VIDEO STOPS UNEXPECTEDLY
// =====================================================

video.addEventListener("pause", () => {

    /*
       Don't immediately fight a deliberate pause.
       Wait briefly and try again.
    */

    setTimeout(() => {

        if (!document.hidden) {
            startWallpaper();
        }

    }, 500);

});


// =====================================================
// 10. ERROR RECOVERY
// =====================================================

video.addEventListener("error", () => {

    console.log("Video error - attempting reload");

    setTimeout(() => {

        const currentTime = video.currentTime;

        video.load();

        video.currentTime = currentTime;

        startWallpaper();

    }, 1000);

});


// =====================================================
// 11. PERIODIC SAFETY CHECK
// =====================================================

setInterval(() => {

    if (
        !document.hidden &&
        video.paused
    ) {

        console.log("Video stopped - restarting");

        startWallpaper();

    }

}, 5000);

</script>

</body>
</html>
