<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Wallpaper</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #wallpaperVideo {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            display: block;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <video
        id="wallpaperVideo"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
    >
        <source src="my.mp4" type="video/mp4">
    </video>

    <script>
        const video = document.getElementById("wallpaperVideo");

        // Make absolutely sure the video is muted before playback.
        video.muted = true;
        video.defaultMuted = true;
        video.setAttribute("muted", "");

        // Try immediately.
        video.play().catch(() => {
            console.log("Autoplay was blocked by the browser.");
        });

        // Try again once the video is ready.
        video.addEventListener("canplay", () => {
            video.play().catch(() => {});
        });

        video.addEventListener("loadeddata", () => {
            video.play().catch(() => {});
        });
    </script>

</body>
</html>
