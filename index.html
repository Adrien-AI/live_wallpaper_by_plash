<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Live Wallpaper</title>
    <style>
        * { margin: 0; padding: 0; overflow: hidden; background: #000; }
        video { width: 100vw; height: 100vh; object-fit: cover; }
    </style>
</head>
<body>
    <!-- 
      The native Mac browser engine REQUIRES 'muted', 'playsinline', and 'loop' 
      arranged natively before it grants automated execution permissions.
    -->
    <video id="wallpaperVideo" src="my.mp4" loop muted playsinline preload="auto"></video>

    <script>
        const video = document.getElementById('wallpaperVideo');

        function triggerAutoplay() {
            // Step 1: Force state reset to absolute zero to satisfy Mac security policies
            video.muted = true;
            video.currentTime = 0;

            // Step 2: Fire the play execution
            const playPromise = video.play();

            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.log("Mac browser layer restricted execution. Initializing backup engine...");
                    
                    // Step 3: Mac WebKit Fail-safe Loop. 
                    // If blocked, this forces a silent event bridge until playback starts.
                    const forceLoop = setInterval(() => {
                        video.play().then(() => {
                            clearInterval(forceLoop);
                            console.log("Autoplay successfully unlocked!");
                        }).catch(() => {
                            // If Mac completely locks the asset, tap the DOM system context directly
                            video.dispatchEvent(new Event('click')); 
                        });
                    }, 50); // Fires every 50ms until the video breaks out of freeze state
                });
            }
        }

        // Execution Hooks: Triggers the code at the absolute earliest possible moment
        if (document.readyState === 'loading') {
            window.addEventListener('DOMContentLoaded', triggerAutoplay);
        } else {
            triggerAutoplay();
        }

        // Secondary backup hook for system network wake delays
        window.addEventListener('load', triggerAutoplay);
    </script>
</body>
</html>
